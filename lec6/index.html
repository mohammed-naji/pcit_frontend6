<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form</title>
</head>

<body>

  name, email, password, phone, dob, gender, image, education, bio

  <form action="" method="get">
    <div>
      <label for="name">Name</label> <br>
      <input type="text" id="name" placeholder="Your Name..">
    </div>
    <br>
    <div>
      <label for="email">Email</label> <br>
      <input type="email" id="email" placeholder="Your Email..">
    </div>
    <br>
    <div>
      <label for="pass">Password</label> <br>
      <input type="password" id="pass" placeholder="Your Password..">
    </div>
    <br>
    <div>
      <label for="phone">Phone</label> <br>
      <input type="number" id="phone" placeholder="Your Phone..">
    </div>
    <br>
    <div>
      <label for="dob">Date of Birth</label> <br>
      <input type="date" id="dob" placeholder="Your Date of Birth..">
    </div>
  </form>

</body>

</html>
